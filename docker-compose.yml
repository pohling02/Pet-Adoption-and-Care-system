services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    container_name: petopia-laravel
    restart: unless-stopped
    tty: true
    volumes:
      - .:/var/www
    networks:
      - petopia-network

  nginx:
    image: nginx:alpine
    container_name: petopia-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - petopia-network
    depends_on:
      - laravel-app

  python-app:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: petopia-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - petopia-network
    deploy:
      resources:
        limits:
          memory: 4G

  mysql-db:
    image: mysql:8.0
    container_name: petopia-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-petopia_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - petopia-dbdata:/var/lib/mysql
    networks:
      - petopia-network

networks:
  petopia-network:
    driver: bridge

volumes:
  petopia-dbdata:
    driver: local